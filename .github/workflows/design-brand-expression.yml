name: Design Brand Expression Integrity

on:
  pull_request:
    paths:
      - "platforms/design/brand-expression/**"
      - "platforms/design/product-extensions/**"
      - "platforms/design/validation/validate_brand_expression.py"
      - "platforms/design/specifications/design-platform-registry.json"
      - "DECISION_INDEX.md"
      - ".github/workflows/design-brand-expression.yml"
  push:
    branches:
      - main
    paths:
      - "platforms/design/brand-expression/**"
      - "platforms/design/product-extensions/**"
      - "platforms/design/validation/validate_brand_expression.py"
      - "platforms/design/specifications/design-platform-registry.json"
      - "DECISION_INDEX.md"
      - ".github/workflows/design-brand-expression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-brand-expression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install validator dependency
        run: python -m pip install "jsonschema==4.23.0"
      - name: Regenerate brand tokens and check drift
        run: python platforms/design/brand-expression/scripts/build_brand_tokens.py --check
      - name: Validate brand expression layer (D-027)
        run: python platforms/design/validation/validate_brand_expression.py
