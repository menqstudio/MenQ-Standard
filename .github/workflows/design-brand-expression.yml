name: Design Brand Expression Integrity

on:
  pull_request:
    paths:
      - "platforms/design/brand-expression/**"
      - "platforms/design/product-extensions/**"
      - "platforms/design/validation/validate_brand_expression.py"
      - "platforms/design/validation/test_validate_brand_expression.py"
      - "platforms/design/specifications/design-platform-registry.json"
      - "DECISION_INDEX.md"
      - ".github/workflows/design-brand-expression.yml"
  push:
    branches:
      - main
    paths:
      - "platforms/design/brand-expression/**"
      - "platforms/design/product-extensions/**"
      - "platforms/design/validation/validate_brand_expression.py"
      - "platforms/design/validation/test_validate_brand_expression.py"
      - "platforms/design/specifications/design-platform-registry.json"
      - "DECISION_INDEX.md"
      - ".github/workflows/design-brand-expression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-brand-expression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install validator dependency
        run: python -m pip install "jsonschema==4.23.0"
      - name: Regenerate brand tokens and check drift
        run: python platforms/design/brand-expression/scripts/build_brand_tokens.py --check
      - name: Validate brand expression layer (D-027)
        run: python platforms/design/validation/validate_brand_expression.py
      - name: Test the brand expression contrast checks
        run: python platforms/design/validation/test_validate_brand_expression.py
