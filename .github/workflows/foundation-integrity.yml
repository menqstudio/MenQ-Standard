name: Foundation Integrity

on:
  push:
    paths:
      - "README.md"
      - "PROJECT_CONTEXT.md"
      - "AI_WORKING_CONTEXT.md"
      - "DECISIONS.md"
      - "DECISION_INDEX.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "COLLABORATION_STYLE.md"
      - "foundation/**"
      - "scripts/validate_foundation.py"
      - ".github/workflows/**"
      - ".gitattributes"
  pull_request:
    paths:
      - "README.md"
      - "PROJECT_CONTEXT.md"
      - "AI_WORKING_CONTEXT.md"
      - "DECISIONS.md"
      - "DECISION_INDEX.md"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "COLLABORATION_STYLE.md"
      - "foundation/**"
      - "scripts/validate_foundation.py"
      - ".github/workflows/**"
      - ".gitattributes"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate Foundation documentation
        run: python scripts/validate_foundation.py
