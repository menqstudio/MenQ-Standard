name: Publish Release

# Builds a release from a tag on main (pushed, or created by workflow_dispatch) and publishes it as a permanent
# GitHub Release asset, so release evidence does not expire with
# workflow-artifact retention.
#   foundation-v<semver>       -> MenQ Standard Foundation snapshot ZIP + SHA256SUMS
#   design-platform-v<semver>  -> MenQ Design Platform release candidate bundle

on:
  push:
    tags:
      - "foundation-v*"
      - "design-platform-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create on the selected main commit (foundation-vX.Y.Z or design-platform-vX.Y.Z[-pre])"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Tag name and commit must be valid
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(foundation-v[0-9]+\.[0-9]+\.[0-9]+|design-platform-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)$ ]] || { echo "Invalid release tag: $RELEASE_TAG"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$RELEASE_TAG target $GITHUB_SHA is not on main"; exit 1; }

  foundation:
    needs: guard
    if: startsWith(inputs.tag || github.ref_name, 'foundation-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate Foundation
        run: python scripts/validate_foundation.py
      - name: Build snapshot, manifest and ZIP
        id: build
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#foundation-v}"
          root="MenQ-Standard-Foundation-v${version}"
          mkdir -p dist
          git archive --format=tar --prefix="${root}/" HEAD | tar -x -C dist
          (cd "dist/${root}" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd dist && zip -qrX "${root}.zip" "${root}" && unzip -tq "${root}.zip")
          (cd dist && sha256sum "${root}.zip" > "${root}.zip.sha256")
          echo "root=${root}" >> "$GITHUB_OUTPUT"
          echo "digest=$(cut -d' ' -f1 "dist/${root}.zip.sha256")" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT: ${{ steps.build.outputs.root }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          **HY:** MenQ Standard Foundation-ի frozen delivery snapshot։ Canonical source-ը մնում է repository-ն։ ZIP-ը պարունակում է commit \`${GITHUB_SHA}\`-ի բոլոր tracked ֆայլերը և \`SHA256SUMS.txt\` manifest-ը։

          **EN:** Frozen delivery snapshot of MenQ Standard Foundation. The repository remains the canonical source. The ZIP contains every tracked file at commit \`${GITHUB_SHA}\` plus the \`SHA256SUMS.txt\` manifest.

          - ZIP SHA-256: \`${DIGEST}\`
          - Built by run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$RELEASE_TAG" "dist/${ROOT}.zip" "dist/${ROOT}.zip.sha256" \
            --target "$GITHUB_SHA" --title "MenQ Standard Foundation ${RELEASE_TAG#foundation-}" --notes-file notes.md

  design-platform:
    needs: guard
    if: startsWith(inputs.tag || github.ref_name, 'design-platform-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install workspace links
        working-directory: platforms/design/implementation
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild generated package inputs
        run: |
          python platforms/design/implementation/scripts/build_tokens.py
          python platforms/design/implementation/scripts/build_foundations.py
          python platforms/design/validation/validate_public_api.py
      - name: Build and cross-validate release candidate
        env:
          MENQ_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python platforms/design/implementation/scripts/build_release_candidate.py --output /tmp/menq-release-a
          python platforms/design/implementation/scripts/build_release_candidate.py --output /tmp/menq-release-b
          python platforms/design/validation/validate_release_candidate.py --primary /tmp/menq-release-a --comparison /tmp/menq-release-b
      - name: Package bundle
        id: build
        run: |
          set -euo pipefail
          name="menq-design-platform-${RELEASE_TAG#design-platform-v}"
          mkdir -p dist
          (cd /tmp && cp -R menq-release-a "$name" && zip -qrX "$GITHUB_WORKSPACE/dist/${name}.zip" "$name")
          (cd dist && unzip -tq "${name}.zip" && sha256sum "${name}.zip" > "${name}.zip.sha256")
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "digest=$(cut -d' ' -f1 "dist/${name}.zip.sha256")" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.build.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          **HY:** MenQ Design Platform-ի preview release bundle (packages, checksums, compatibility, rollback evidence)՝ deterministic կրկնակի build-ով ստուգված։ Private preview է, npm-ում չի հրապարակվում։

          **EN:** MenQ Design Platform preview release bundle (packages, checksums, compatibility and rollback evidence), verified by a deterministic double build. Private preview; not published to npm.

          - Source commit: \`${GITHUB_SHA}\`
          - Bundle SHA-256: \`${DIGEST}\`
          - Built by run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$RELEASE_TAG" "dist/${NAME}.zip" "dist/${NAME}.zip.sha256" \
            --target "$GITHUB_SHA" --title "MenQ Design Platform ${RELEASE_TAG#design-platform-}" --notes-file notes.md --prerelease
