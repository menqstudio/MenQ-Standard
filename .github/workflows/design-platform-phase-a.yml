name: Design Platform Phase A Integrity

on:
  push:
    branches:
      - d-025-design-platform-architecture-v1
    paths:
      - "platforms/design/specifications/**"
      - "platforms/design/implementation/**"
      - "platforms/design/validation/**"
      - ".github/workflows/design-platform-phase-a.yml"
  pull_request:
    paths:
      - "platforms/design/specifications/**"
      - "platforms/design/implementation/**"
      - "platforms/design/validation/**"
      - ".github/workflows/design-platform-phase-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-phase-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspace links
        working-directory: platforms/design/implementation
        run: |
          corepack enable
          pnpm install --ignore-scripts
      - name: Validate Design Platform Phase A registry and workspace skeleton
        run: python platforms/design/validation/validate_phase_a.py
      - name: Validate registry and package public API parity
        run: python platforms/design/validation/validate_public_api.py
      - name: Smoke-test design contracts public API
        run: |
          node --input-type=module -e "import('./platforms/design/implementation/packages/design-contracts/src/index.js').then((m) => { m.assertCanonicalTokenId('menq.design.token.reference.color.neutral.0'); m.assertBilingualDescription({hy:'հայերեն',en:'English'}); if (m.TOKEN_SOURCE_SCHEMA_ID !== 'menq.design.schema.token-source.v1') process.exit(1); })"
      - name: Build deterministic token artifacts
        run: python platforms/design/implementation/scripts/build_tokens.py
      - name: Verify deterministic token rebuild
        run: |
          cp platforms/design/implementation/packages/design-tokens/generated/manifest.json /tmp/menq-token-manifest.json
          python platforms/design/implementation/scripts/build_tokens.py
          cmp /tmp/menq-token-manifest.json platforms/design/implementation/packages/design-tokens/generated/manifest.json
      - name: Smoke-test Design Foundations public API
        run: |
          node --input-type=module -e "import('./platforms/design/implementation/packages/design-foundations/src/index.js').then((m) => { if (m.foundationClass('stack') !== 'menq-stack') process.exit(1); })"
      - name: Build deterministic Design Foundations artifacts
        run: python platforms/design/implementation/scripts/build_foundations.py
      - name: Verify deterministic Design Foundations rebuild
        run: |
          cp platforms/design/implementation/packages/design-foundations/generated/manifest.json /tmp/menq-foundations-manifest.json
          python platforms/design/implementation/scripts/build_foundations.py
          cmp /tmp/menq-foundations-manifest.json platforms/design/implementation/packages/design-foundations/generated/manifest.json
      - name: Smoke-test Design Primitives public API
        run: |
          node --input-type=module <<'NODE'
          const m = await import('./platforms/design/implementation/packages/design-primitives/src/index.js');
          const button = m.buttonProps({ pressed: true, controlsId: 'panel-a' });
          if (button.type !== 'button' || button['aria-pressed'] !== true || button['aria-controls'] !== 'panel-a') process.exit(1);
          const link = m.linkProps({ href: 'https://example.com', external: true });
          if (link.target !== '_blank' || link.rel !== 'noopener noreferrer') process.exit(1);
          const disclosure = m.disclosureProps({ expanded: false, triggerId: 'trigger-a', contentId: 'content-a' });
          if (disclosure.content.hidden !== true || disclosure.trigger['aria-controls'] !== 'content-a') process.exit(1);
          if (m.primitiveClass('visuallyHidden') !== 'menq-visually-hidden') process.exit(1);
          NODE
      - name: Smoke-test internal Design Components contracts
        run: |
          node --input-type=module <<'NODE'
          const m = await import('./platforms/design/implementation/packages/design-components/src/index.js');
          const button = m.buttonComponentProps({ variant: 'primary', size: 'md', loading: true, controlsId: 'panel-a' });
          if (button.disabled !== true || button['aria-busy'] !== true || button['data-menq-component'] !== 'button') process.exit(1);
          const card = m.cardComponentProps({ variant: 'outlined', labelledBy: 'card-title' });
          if (card['aria-labelledby'] !== 'card-title' || card['data-variant'] !== 'outlined') process.exit(1);
          NODE
      - name: Verify generated artifact checksums
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          roots = [
              Path('platforms/design/implementation/packages/design-tokens/generated'),
              Path('platforms/design/implementation/packages/design-foundations/generated'),
          ]
          verified = 0
          for root in roots:
              manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
              for artifact in manifest['artifacts']:
                  path = root / artifact['path']
                  data = path.read_bytes()
                  assert len(data) == artifact['bytes'], str(path)
                  assert hashlib.sha256(data).hexdigest() == artifact['sha256'], str(path)
                  verified += 1
          print(f"Verified {verified} generated artifact checksums.")
          PY
