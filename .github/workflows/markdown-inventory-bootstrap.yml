name: Markdown Inventory Integrity

on:
  push:
    branches:
      - main
      - d-025-post-merge-closure
    paths:
      - "**/*.md"
      - "foundation/ai-collaboration/MARKDOWN_INVENTORY.json"
      - "foundation/ai-collaboration/SESSION_READ_MANIFEST.json"
      - "scripts/generate_markdown_inventory.py"
      - "scripts/check_session_read_budget.py"
      - "scripts/test_check_session_read_budget.py"
      - "scripts/validate_foundation.py"
      - "scripts/validate_platforms.py"
      - "scripts/test_generate_markdown_inventory.py"
      - "scripts/test_validate_foundation.py"
      - "scripts/test_validate_platforms.py"
      - ".github/workflows/**"
      - ".github/workflows/markdown-inventory-bootstrap.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "foundation/ai-collaboration/MARKDOWN_INVENTORY.json"
      - "foundation/ai-collaboration/SESSION_READ_MANIFEST.json"
      - "scripts/generate_markdown_inventory.py"
      - "scripts/check_session_read_budget.py"
      - "scripts/test_check_session_read_budget.py"
      - "scripts/validate_foundation.py"
      - "scripts/validate_platforms.py"
      - "scripts/test_generate_markdown_inventory.py"
      - "scripts/test_validate_foundation.py"
      - "scripts/test_validate_platforms.py"
      - ".github/workflows/**"
      - ".github/workflows/markdown-inventory-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate exact Markdown inventory diagnostic
        run: |
          cp foundation/ai-collaboration/MARKDOWN_INVENTORY.json /tmp/MARKDOWN_INVENTORY.committed.json
          python scripts/generate_markdown_inventory.py --write
          cp foundation/ai-collaboration/MARKDOWN_INVENTORY.json /tmp/MARKDOWN_INVENTORY.generated.json
          cp /tmp/MARKDOWN_INVENTORY.committed.json foundation/ai-collaboration/MARKDOWN_INVENTORY.json
      - name: Upload exact Markdown inventory diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markdown-inventory-diagnostic
          path: /tmp/MARKDOWN_INVENTORY.generated.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate canonical Markdown inventory
        run: python scripts/generate_markdown_inventory.py --check
      - name: Validate Foundation and D-026 integrity
        run: python scripts/validate_foundation.py
      - name: Validate Platforms and D-025 integrity
        run: python scripts/validate_platforms.py
      - name: Test the Markdown inventory generator
        run: python scripts/test_generate_markdown_inventory.py
      - name: Test the Foundation validator
        run: python scripts/test_validate_foundation.py
      - name: Test the Platforms validator
        run: python scripts/test_validate_platforms.py
      - name: Test the session-read budget gate
        run: python scripts/test_check_session_read_budget.py
      - name: Validate session-read manifest and core byte budget (D-028)
        run: python scripts/check_session_read_budget.py
