name: Markdown Inventory Bootstrap

on:
  push:
    branches:
      - d-025-design-platform-architecture-v1
    paths:
      - "**/*.md"
      - "scripts/generate_markdown_inventory.py"
      - ".github/workflows/markdown-inventory-bootstrap.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/generate_markdown_inventory.py"
      - ".github/workflows/markdown-inventory-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d-025-design-platform-architecture-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate tracked Markdown inventory
        run: python scripts/generate_markdown_inventory.py --write
      - name: Validate generated inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('foundation/ai-collaboration/MARKDOWN_INVENTORY.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['file_count'] == len(data['files'])
          assert data['file_count'] > 0
          paths = [entry['path'] for entry in data['files']]
          assert paths == sorted(paths)
          assert len(paths) == len(set(paths))
          print(f"Generated inventory for {data['file_count']} tracked Markdown files")
          PY
      - name: Commit canonical manifest when changed
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- foundation/ai-collaboration/MARKDOWN_INVENTORY.json; then
            echo "Markdown inventory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundation/ai-collaboration/MARKDOWN_INVENTORY.json
          git commit -m "Update canonical Markdown inventory"
          git push origin HEAD:d-025-design-platform-architecture-v1
      - name: Upload Markdown inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-inventory
          path: foundation/ai-collaboration/MARKDOWN_INVENTORY.json
          if-no-files-found: error
