name: Platforms Integrity

on:
  pull_request:
    paths:
      - "platforms/**"
      - "scripts/validate_platforms.py"
      - ".github/workflows/platforms-integrity.yml"
      - "DECISION_INDEX.md"
      - "README.md"
      - "PROJECT_CONTEXT.md"
      - "AI_WORKING_CONTEXT.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - "ECOSYSTEM_ARCHITECTURE.md"
      - "NEXT_CHAT_HANDOFF.md"
  push:
    branches:
      - main
    paths:
      - "platforms/**"
      - "scripts/validate_platforms.py"
      - ".github/workflows/platforms-integrity.yml"
      - "DECISION_INDEX.md"
      - "README.md"
      - "PROJECT_CONTEXT.md"
      - "AI_WORKING_CONTEXT.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - "ECOSYSTEM_ARCHITECTURE.md"
      - "NEXT_CHAT_HANDOFF.md"
  workflow_dispatch:

jobs:
  validate-platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Platforms architecture
        run: python scripts/validate_platforms.py
