name: Platforms Integrity

on:
  pull_request:
    paths:
      - "platforms/**"
      - "scripts/validate_platforms.py"
      - ".github/workflows/platforms-integrity.yml"
      - "DECISION_INDEX.md"
      - "README.md"
      - "PROJECT_CONTEXT.md"
      - "AI_WORKING_CONTEXT.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - "ECOSYSTEM_ARCHITECTURE.md"
      - "NEXT_CHAT_HANDOFF.md"
  push:
    branches:
      - main
    paths:
      - "platforms/**"
      - "scripts/validate_platforms.py"
      - ".github/workflows/platforms-integrity.yml"
      - "DECISION_INDEX.md"
      - "README.md"
      - "PROJECT_CONTEXT.md"
      - "AI_WORKING_CONTEXT.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - "ECOSYSTEM_ARCHITECTURE.md"
      - "NEXT_CHAT_HANDOFF.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate Platforms architecture
        run: python scripts/validate_platforms.py
